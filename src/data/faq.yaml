# Frequently asked questions. Order here is display order.
- q: Do I need to know how to program?
  a: No. The practicals use notebooks and graphical tools. Some familiarity with Fiji or another image analysis program helps.
- q: Do I need my own laptop?
  a: No. The workshop runs on the University of Cape Town computer rooms and on cloud desktops prepared for the course.
- q: Can I bring my own data?
  a: Yes, and we encourage it. The application form asks about your imaging project and the data you could bring.
- q: Who can apply for a bursary?
  a: Selected participants based at African institutions. The application form asks about bursary and visa needs.
- q: I need a visa to travel to South Africa. Can you help?
  a: Yes. Selected participants receive an invitation letter, and visa costs are covered by the bursary.
- q: Can I attend online?
  a: The talks are streamed and recorded. The hands-on practicals are in person only.
- q: How are participants selected?
  a: A panel with members from each organising team scores applications against a published set of criteria.
