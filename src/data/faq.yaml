# Frequently asked questions. Order here is display order. Answers may hold simple HTML links.
- q: Do I need to know how to program?
  a: No, although some basic familiarity helps. The practical sessions use notebooks and graphical tools. We assume familiarity with Fiji or another image analysis program.
- q: Do I need to bring my own laptop?
  a: No. All practical sessions take place in a computer lab, and our team will support you in using the computers provided.
- q: Can I bring my own data?
  a: Yes, and we encourage it. You can discuss your own analysis problems with the faculty.
- q: Who can apply for a fellowship?
  a: Anyone. Fellowships are awarded through competitive selection, with a particular focus on supporting researchers from African countries. There is no separate application; select your preferred fellowship tier in the application form.
- q: I need a visa to travel to South Africa. Can you help?
  a: Attendees arrange their own visas, and fellowships do not cover visa fees. We can provide letters of invitation on request. Visa processing can take several weeks, so apply as early as possible.
- q: Can I attend online?
  a: Yes. The talks will be streamed live, so researchers who cannot travel to Cape Town can take part. Online participants can complete the practical sessions in their own time, with faculty available for online support at designated times. The Company of Biologists' Fund for Innovations in Sustainable Conferencing pays for the recording and streaming equipment and its technical support. A limited number of online registration fee waivers are available for researchers from African countries. Further details on online participation will follow.
- q: How are participants selected?
  a: A panel with members from each organising team reviews applications. Selection places particular weight on active imaging practice and readiness to benefit from the workshop.
