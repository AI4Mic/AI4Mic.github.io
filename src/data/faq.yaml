# Frequently asked questions. Order here is display order.
- q: Do I need to know how to program?
  a: We expect not. The practicals use notebooks and graphical tools, and familiarity with Fiji or another image analysis program helps. We will confirm the requirements when applications open.
- q: Do I need my own laptop?
  a: To be confirmed. The course uses cloud desktops prepared for the workshop, and we will say whether you need to bring a laptop when applications open.
- q: Can I bring my own data?
  a: We encourage it. Details on how to prepare a dataset will follow with the application form.
- q: Who can apply for a bursary?
  a: Selected participants based at African institutions. The application form asks whether you need a bursary.
- q: I need a visa to travel to South Africa. Can you help?
  a: Visa fees are not covered by the bursary. We will publish what support we can offer with visa applications when applications open.
- q: Can I attend online?
  a: The talks will be streamed. Details on online participation will follow.
- q: How are participants selected?
  a: A panel with members from each organising team reviews applications. We will publish the selection criteria with the application form.
