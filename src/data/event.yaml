# Single source for the workshop facts. Every page reads from here.
# Dates: confirm before publishing (12-14 vs 13-15 April 2027).
shortName: AI in Action
title: "AI in Action"
subtitle: "A hands-on bootcamp in machine learning for bioimage analysis"
start: 2027-04-13
end: 2027-04-15
datesDisplay: "13–15 April 2027"
timezone: Africa/Johannesburg
venue:
  name: University of Cape Town
  city: Cape Town
  country: South Africa
  url: https://www.uct.ac.za/
  campus: "The workshop takes place on the University of Cape Town's Faculty of Health Sciences campus, in Observatory, Cape Town."
  map: https://maps.app.goo.gl/zFoWTTRRuws6PNu59
contact: kristy.winkler@uct.ac.za
format: "Three days of in-person practicals at the University of Cape Town, with talks streamed online."
intro: >-
  AI in Action is a three-day training workshop for life scientists who
  image cells and tissues and want to analyse their data with deep learning.
  Participants train and use segmentation models on real microscopy data,
  learn to check whether the results can be trusted, and leave able to run the
  same methods at their home institution without special hardware.
audience: >-
  The call is open to researchers worldwide. Priority goes to early-career
  researchers at African institutions who generate microscopy data. We expect
  the practicals to need little or no programming.
applications:
  opens: 2026-12-01
  closes: 2027-02-01
  url: ""   # application form link, added when the form is ready
  text: "Applications are submitted through our online form. Before you begin, please have the following ready:"
  needs:
    - A CV
    - One representative microscopy image from your own work
timeline:
  - date: 2026-12-01
    label: Applications open
  - date: 2027-02-01
    label: Applications close
  - date: 2027-04-13
    label: Workshop begins in Cape Town
learn:
  - title: Deep learning in the browser
    text: Train and apply models with ZeroCostDL4Mic notebooks on Google Colab, with no installation.
  - title: Reproducible training
    text: Run the same notebooks in containers with DL4MicEverywhere, on a laptop, a workstation or a cluster.
  - title: Segmentation of cells and nuclei
    text: Segment microscopy images with StarDist and U-Net, in Fiji and in Python.
  - title: Trusting the result
    text: Build ground truth, choose quality metrics and spot when a model fails on your data.
  - title: Your own images
    text: Bring a dataset from your own project and work on it with the instructors.
  - title: Back at your institution
    text: Run the same methods on Google Colab or on your own computer, so they keep working after the workshop.
fees:
  rows:
    - attendance: In person
      standard: "€250"
      tableC: "€100"
    - attendance: Online
      standard: "€20"
      tableC: "€20"
  notes:
    - The in-person registration fee includes lunches and dinners throughout the workshop, all workshop materials, and access to computers for the practical sessions.
    - The online registration fee includes live access to the talks, the practical session materials, and online support from faculty at designated times.
    - 'The Table C rate applies to in-person participants currently working in a country listed in Table C ("Developing economies by region") of the statistical annex of the United Nations <em>World Economic Situation and Prospects 2022</em> report. The <a href="https://www.un.org/development/desa/dpad/wp-content/uploads/sites/45/WESP2022_ANNEX.pdf" rel="noopener">full list of countries</a> is in the annex.'
fellowships:
  heading: Fellowships
  text: >-
    A limited number of fellowships are available. They are awarded through
    competitive selection, with a particular focus on supporting researchers
    from African countries.
  tiers:
    - name: Full fellowships
      text: cover travel, accommodation and a registration fee waiver.
    - name: Partial fellowships
      text: cover accommodation and a registration fee waiver.
    - name: Online fellowships
      text: cover an online registration fee waiver.
  notes:
    - Full fellowships are the most competitive. Fellowships do not cover visa fees.
    - Applicants based in Cape Town are eligible for a registration fee waiver only, without travel or accommodation support.
    - There is no separate fellowship application. Select your preferred fellowship tier in the application form and complete the fellowship questions.
travel:
  - title: Getting to Cape Town and the venue
    text: Cape Town International Airport is a 20 to 30 minute drive from the Health Sciences campus. We recommend Uber from the airport; it is reliable and widely used in Cape Town.
  - title: Accommodation
    text: We recommend the Protea Hotel by Marriott Cape Town Mowbray or the DoubleTree by Hilton Cape Town Upper Eastside. Other options are on Airbnb and Booking.com; the Observatory area is the most convenient for the Health Sciences campus. Please travel to and from campus by Uber, not on foot.
  - title: Visas
    text: Attendees arrange their own visas, and fellowships do not cover visa fees. Check whether you need a visa on the <a href="https://www.dha.gov.za/" rel="noopener">South African Department of Home Affairs</a> website. Visa processing can take several weeks, so apply as soon as your place is confirmed.
accessibility: >-
  We want everyone to be able to take part fully in the workshop. If you
  have accessibility requirements, including mobility, dietary or other
  needs, tell us when you apply or by email, and we will do our best to
  accommodate them.
cancellation:
  - name: Self-funded participants
    text: cancellations received in writing before 1 March 2027 receive a refund of the registration fee, less an administration fee of €50. We cannot give refunds for cancellations after this date.
  - name: Fellowship recipients
    text: if you can no longer attend, please tell us as soon as possible so that we can offer your place to another applicant. Where the University of Cape Town has already booked your travel, we may ask you to cover costs that cannot be recovered.
